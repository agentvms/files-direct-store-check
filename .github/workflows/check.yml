# Written by the export step of the private source repository; do not edit here.
# Runs on every push and pull request: build, unit tests, the plugin folder's checks, and the list of what the package would hold.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.14.0', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: What the package would hold
        run: npm run check:pack

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.14.0'
      - name: The plugin folder's file rules
        run: npm run check:plugin
      - name: Install Claude Code (a pinned version, to validate the plugin folder)
        run: npm install --global @anthropic-ai/claude-code@2.1.330
      - name: Validate the plugin folder the way Claude's directory reads it
        run: claude plugin validate plugin --profile directory --strict
